[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paraglideml"
version = "0.2.1"
description = "Machine Learning model to predict paragliding flyable days using GFS data."
authors = [
  { name = "Gena", email = "gena@example.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Lean core = the inference set (torch-free). `pip install paraglideml` gives a working
# predictor from the bundled exp_056 model. Heavy training/NN/plotting libs are in [train].
dependencies = [
    "typer",
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "pygrib",
    "tqdm",
]

[project.optional-dependencies]
# Explicit alias for the lean install; the core deps above already cover inference.
inference = []
# Training, the NN model and plotting. CPU-only torch:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
train = [
    "torch",
    "xarray",
    "cfgrib",
    "matplotlib",
    "seaborn",
    "cartopy",
]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "jupyterlab",
    "ipykernel",
]

[project.scripts]
paraglideml = "paraglideml.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# Bundle the default model (exp_056) + spot terrain + cell list into the wheel, so
# `pip install paraglideml` ships a self-contained predictor (~2.8 MB). See paraglideml.assets.
[tool.setuptools.package-data]
paraglideml = ["assets/model/*", "assets/*.json"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
